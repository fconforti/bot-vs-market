{% extends "base.html" %}
{% block content %}
<h1>Research</h1>
<p class="muted">Weekly research entries, newest first. At most one hypothesis per week; the default outcome is "no change".</p>
{% for e in entries %}
<article class="entry card prose" id="{{ e.anchor }}">
  <div class="meta"><a href="#{{ e.anchor }}">{{ e.date }}</a></div>
  {{ e.html|safe }}
</article>
{% else %}
<p class="muted">No research entries yet.</p>
{% endfor %}
{% endblock %}
