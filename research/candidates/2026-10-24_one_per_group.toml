# Candidate 2026-10-24 one_per_group: strategy/params.toml (v002) plus [groups].
# Everything above [groups] is identical to v002.
version = "candidate_one_per_group"

[trend]
isin = "IE00B4L5Y983"
sma_days = 200
exit_band = 0.03

[momentum]
lookback_days = 252
skip_days = 21
min_history_days = 260

[selection]
top_n = 4
hold_rank = 7
rebalance_window_days = 3
exit_on_negative_momentum = true
exits_only_in_rebalance_window = true
sleeve_types = ["etf", "stock", "etc", "crypto"]

[sizing]
target_weight = 0.25
order_cap_pct_of_nav = 0.24
min_order_eur = 100
price_buffer = 0.01
cash_reserve_eur = 5
max_orders_per_day = 2

# Near-duplicates: at most one held per group (entry rule only). Written on 2026-10-24
# from what the instruments hold, before any backtest of this rule was run; not tuned.
