# Run with: uvx pre-commit install   (installs the git hook)
#           uvx pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan, system binary)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
      - id: append-only
        name: append-only history (journal/, trades/, portfolio/, research/)
        entry: uv run python bin/check-append-only.py
        language: system
        pass_filenames: false
